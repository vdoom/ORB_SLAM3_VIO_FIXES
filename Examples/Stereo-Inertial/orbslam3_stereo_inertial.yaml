%YAML:1.0

# New format required for proper stereo rectification in ORB-SLAM3
File.version: "1.0"

#--------------------------------------------------------------------------------------------
# Camera Parameters. Stereo calibration using Kalibr with April grid.
# Source: kalibr_data_2026-04-09_14-29-24_imu_calm-camchain-imucam.yaml
# Resolution: 640x400
# Distortion model: equidistant -> ORB-SLAM3 type: KannalaBrandt8
#--------------------------------------------------------------------------------------------
Camera.type: "KannalaBrandt8"

# Left camera (cam0) intrinsics (2026-04-09)
Camera1.fx: 359.6543289318808
Camera1.fy: 362.1601497065558
Camera1.cx: 328.2822168973956
Camera1.cy: 199.98008351712082

# Left camera distortion (equidistant/fisheye model: k1, k2, k3, k4)
Camera1.k1: 0.39070305155507806
Camera1.k2: 0.4369220409538892
Camera1.k3: -1.2166545825107706
Camera1.k4: 0.8622033738618571

# Stereo overlapping area (column range visible from both cameras)
Camera1.overlappingBegin: 0
Camera1.overlappingEnd: 639

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# Right Camera (cam1) Parameters
#--------------------------------------------------------------------------------------------

# Right camera (cam1) intrinsics (2026-04-09)
Camera2.fx: 358.587662807276
Camera2.fy: 361.0325876142542
Camera2.cx: 312.25633229921664
Camera2.cy: 176.87364341973733

# Right camera distortion (equidistant/fisheye model: k1, k2, k3, k4)
Camera2.k1: 0.41891340593660503
Camera2.k2: 0.25137833231431345
Camera2.k3: -0.7671228483796916
Camera2.k4: 0.49917758523929484

# Stereo overlapping area (column range visible from both cameras)
Camera2.overlappingBegin: 0
Camera2.overlappingEnd: 639

#--------------------------------------------------------------------------------------------
# Stereo Extrinsics (new format uses Stereo.T_c1_c2 instead of Tlr)
# T_c1_c2 = T_lr = pose of right camera in left camera's frame
# = INVERSE of Kalibr's T_cn_cnm1 (2026-04-09)
#--------------------------------------------------------------------------------------------
Stereo.T_c1_c2: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.9999996165107403, -0.0006454547986558447, 0.0005919176238929212, 0.08730149037826528,
          0.0006539563246037033, 0.9998949922811669, -0.014476765943023794, -0.0011114145058922153,
          -0.0005825113699265575, 0.014477147479613341, 0.9998950309314252, -5.14977632285231e-05,
          0.0, 0.0, 0.0, 1.0]

# Close/Far Threshold. Baseline times.
# depth < 40.0 * 0.0873m = 3.49m is considered "close" (reliable stereo)
Stereo.ThDepth: 40.0

#--------------------------------------------------------------------------------------------
# IMU Parameters. From Kalibr calibration.
# Source: kalibr_data_2026-04-09_14-29-24_imu_calm-imu.yaml
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-04-09)
IMU.NoiseGyro: 0.0011544
IMU.NoiseAcc: 0.012624
IMU.GyroWalk: 2.1108e-05
IMU.AccWalk: 0.00036251

# IMU sampling frequency
IMU.Frequency: 500.0

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: left camera to IMU/body frame)
# T_ic = inv(T_cam0_imu) from Kalibr (2026-04-09)
#--------------------------------------------------------------------------------------------
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.01700647591192539, -0.9998385261339644, -0.005805293732298638, 0.004328076817815564,
          0.9998487637275368, -0.01698495542788614, -0.00373643702319871, -0.04406960658723863,
          0.003637231030978497, -0.005867959387545468, 0.9999761685175567, 0.041553497920893946,
          0.0, 0.0, 0.0, 1.0]

# Insert KFs when there is no visual odometry (1 = better recovery after tracking loss)
IMU.InsertKFsWhenLost: 1

# Camera-IMU time offset from Kalibr: t_imu = t_cam + 0.00770074s
Camera.TimeOffset: 0.007700739317982234

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 800

# ORB Extractor: Scale factor between levels in the scale pyramid 
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
