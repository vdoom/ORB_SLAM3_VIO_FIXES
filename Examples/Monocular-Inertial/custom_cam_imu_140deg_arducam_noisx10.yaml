%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# Source: kalibr_data_2026-03-04_13-46-15-camchain-imucam.yaml
# Resolution: 640x400
#--------------------------------------------------------------------------------------------
Camera.type: "KannalaBrandt8"

# Camera intrinsics from Kalibr calibration (2026-03-04)
Camera.fx: 235.53811270899755
Camera.fy: 237.74884854527778
Camera.cx: 320.4677915232717
Camera.cy: 187.44597968732478

# Distortion parameters (equidistant/fisheye model: k1, k2, k3, k4)
Camera.k1: 0.016857365363939555
Camera.k2: -0.00453560050451227
Camera.k3: 9.526346919041887e-05
Camera.k4: -0.0005758450662437539

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. From Kalibr calibration.
# Source: kalibr_data_2026-03-04_13-46-15-imu.yaml
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-03-04)
IMU.NoiseGyro: 1.1544e-02
IMU.NoiseAcc: 1.2624e-01
IMU.GyroWalk: 2.1108e-04
IMU.AccWalk: 2.1607e-03

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_ic = inv(T_cam_imu) from Kalibr calibration (2026-03-04)
# Tbc = T_ic: transforms points from camera frame to IMU/body frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.028572208783627796, 0.9993904449943096, -0.02005909617355371, 0.0033507077412571235,
          0.9991912341346341, -0.02798700959801389, 0.028872217134585567, -0.00016077230928320256,
          0.02829322381296908, -0.020867816077294075, -0.9993818227976896, -0.0577783224985986,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr: t_imu = t_cam + 0.00866895, so t_cam = t_imu - 0.00866895
# Negated because our timestamps are IMU-based (trigger timestamps)
#Camera.TimeOffset: 0.0
Camera.TimeOffset: -0.008668951983003046

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 6

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 8
ORBextractor.minThFAST: 3

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
