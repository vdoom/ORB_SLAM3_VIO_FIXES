%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# Source: kalibr_data_2026-02-23_13-39-35-camchain-imucam.yaml
# Resolution: 640x400
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera intrinsics from Kalibr calibration (2026-02-23)
Camera.fx: 554.0615666200614
Camera.fy: 559.2933839943432
Camera.cx: 360.74805538409424
Camera.cy: 180.33408564777724

# Distortion parameters (radtan model: k1, k2, p1, p2)
Camera.k1: -0.4261109586516469
Camera.k2: 0.17020932840991074
Camera.p1: 4.8446955708118645e-05
Camera.p2: -0.0011043612273267227

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. From Kalibr calibration.
# Source: kalibr_data_2026-02-23_13-39-35-imu.yaml
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-02-23)
# Kalibr base values: gyro=0.000135, accel=0.00207, gyroWalk=3e-05, accelWalk=0.0003
# Scaled 5x for ORB-SLAM3 (Kalibr values are too tight, causing over-trust of IMU)
IMU.NoiseGyro: 0.000675
IMU.NoiseAcc: 0.01035
IMU.GyroWalk: 1.5e-04
IMU.AccWalk: 0.0015

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_ic = inv(T_cam_imu) from Kalibr calibration (2026-02-23)
# Tbc = T_ic: transforms points from camera frame to IMU/body frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.032987776930417136, 0.9991124282114241, -0.026194701117992446, 0.005839747869848419,
          0.9993308596338923, -0.032557997537710125, 0.016667626697287004, 0.0002971131913911424,
          0.015799985967547326, -0.026727001137545843, -0.9995178977155031, -0.04286304337176731,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr: t_imu = t_cam + 0.0069431, so t_cam = t_imu - 0.0069431
# Negated because our timestamps are IMU-based (trigger timestamps)
Camera.TimeOffset: -0.006943099768197186

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1500

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 8
ORBextractor.minThFAST: 3

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
