%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# Resolution: 640x400
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera intrinsics from Kalibr calibration (2026-02-10)
Camera.fx: 345.0592653819115
Camera.fy: 347.7649647695906
Camera.cx: 291.5874246667511
Camera.cy: 184.76949119326292

# Distortion parameters (radtan model: k1, k2, p1, p2)
Camera.k1: -0.29630290144892685
Camera.k2: 0.06211057762978921
Camera.p1: 0.001994662738142783
Camera.p2: 0.0018520964501777364

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. From Kalibr calibration.
# Source: kalibr_data_2026-02-10_13-14-11-imu.yaml
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-02-10)
IMU.NoiseGyro: 0.00027
IMU.NoiseAcc: 0.00414
IMU.GyroWalk: 6e-05
IMU.AccWalk: 0.0006

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_cam_imu from Kalibr calibration (2026-02-10)
# Transforms points from IMU frame to camera frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.0425801997986775, -0.9990641302211013, -0.00760199254525569, 0.0015277657040238149,
          0.9975315685985257, 0.04208718209347656, 0.05620888499867664, -0.003116094505273255,
          -0.05583633435737538, -0.009976613101847748, 0.998390089572481, -0.032200390102634285,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr: t_imu = t_cam + 0.00568391, so t_cam = t_imu - 0.00568391
# Negated because our timestamps are IMU-based (trigger timestamps)
Camera.TimeOffset: -0.005683907835043637

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# Image Preprocessing (for dark cameras)
# Set to 0 to disable. Typical values: 1.0 (gentle) - 3.0 (aggressive)
#--------------------------------------------------------------------------------------------
ImagePreprocess.CLAHE: 1.5

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1500

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 8
ORBextractor.minThFAST: 3

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
