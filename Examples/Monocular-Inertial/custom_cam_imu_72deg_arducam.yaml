%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# Source: kalibr_data_2026-02-26_14-06-14-camchain-imucam.yaml
# Resolution: 640x400
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera intrinsics from Kalibr calibration (2026-02-26)
Camera.fx: 543.9053785605963
Camera.fy: 548.773661612939
Camera.cx: 314.16178823983694
Camera.cy: 193.9433995158546

# Distortion parameters (radtan model: k1, k2, p1, p2)
Camera.k1: -0.422007818262373
Camera.k2: 0.16467170124907848
Camera.p1: -0.0014792971237499516
Camera.p2: -0.00045124357181782973

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. From Kalibr calibration.
# Source: kalibr_data_2026-02-26_14-06-14-imu.yaml
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-02-26)
IMU.NoiseGyro: 0.000135
IMU.NoiseAcc: 0.00207
IMU.GyroWalk: 3e-05
IMU.AccWalk: 0.004 #IMU.AccWalk: 0.0003

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_ic = inv(T_cam_imu) from Kalibr calibration (2026-02-26)
# Tbc = T_ic: transforms points from camera frame to IMU/body frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.029617016991960878, 0.99944643398947, -0.015154467665699663, 0.007373522955875888,
          0.9994236154263432, -0.02935788105640321, 0.01704557854740397, -0.00021394894359563876,
          0.016591239635287584, -0.015650572053791435, -0.9997398613448172, -0.04839037104430822,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr: t_imu = t_cam + 0.00720022, so t_cam = t_imu - 0.00720022
# Negated because our timestamps are IMU-based (trigger timestamps)
Camera.TimeOffset: -0.007200219227920966

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1500

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 8
ORBextractor.minThFAST: 3

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
