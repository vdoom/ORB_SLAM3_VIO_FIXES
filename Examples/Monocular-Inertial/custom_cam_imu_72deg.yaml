%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# Source: kalibr_data-camchain-imucam.yaml
# Resolution: 640x400
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera intrinsics from Kalibr calibration (2026-02-23)
Camera.fx: 553.124267080316
Camera.fy: 557.7157441040492
Camera.cx: 323.9678806316275
Camera.cy: 193.08932125128922

# Distortion parameters (radtan model: k1, k2, p1, p2)
Camera.k1: -0.4392840729450221
Camera.k2: 0.190344091426536
Camera.p1: -0.0005533761699227125
Camera.p2: -0.0007612869242764899

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. From Kalibr calibration.
# Source: kalibr_data-imu.yaml
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-02-23)
IMU.NoiseGyro: 0.000135
IMU.NoiseAcc: 0.00207
IMU.GyroWalk: 3e-05
IMU.AccWalk: 0.0003

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_ic = inv(T_cam_imu) from Kalibr calibration (2026-02-23)
# Tbc = T_ic: transforms points from camera frame to IMU/body frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.04023739442437997, -0.9983598472040539, 0.04072551510581803, 0.002536839181844547,
          -0.9991336981431637, -0.04063493338541051, -0.008980836460364704, -0.0002975748982839791,
          0.010620985109745752, -0.040328869057544715, -0.9991300100566678, -0.040986559595629656,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr: t_imu = t_cam + 0.00766661, so t_cam = t_imu - 0.00766661
# Negated because our timestamps are IMU-based (trigger timestamps)
Camera.TimeOffset: -0.00766661217877531

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1500

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 8
ORBextractor.minThFAST: 3

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
