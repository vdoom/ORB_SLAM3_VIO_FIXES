%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# OV9281 global shutter monochrome camera, 640x400
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera intrinsics from Kalibr calibration (2026-01-31)
Camera.fx: 532.9655622598409
Camera.fy: 538.0585059709547
Camera.cx: 296.1702254400371
Camera.cy: 184.74183698582925

# Distortion parameters (radtan model: k1, k2, p1, p2)
Camera.k1: -0.4265980263872616
Camera.k2: 0.15965013413928592
Camera.p1: 0.0015871551140746781
Camera.p2: 0.0006992574112767907

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. ICM-42688 IMU via Raspberry Pi Pico (SYSROX sensor PCB).
# Noise parameters from Kalibr IMU-camera calibration.
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-01-31)
IMU.NoiseGyro: 0.000135
IMU.NoiseAcc: 0.00207
IMU.GyroWalk: 3.0e-05
IMU.AccWalk: 0.0003

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_cam_imu from Kalibr calibration (2026-01-31)
# Transforms points from IMU frame to camera frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.9948965803054255, -0.07823336971112475, 0.0637207529790149, 0.024481889769978702,
          -0.06149388366756402, -0.03055344424576667, -0.9976397091717035, 9.64225766529943e-05,
          0.07999560467957144, -0.9964667716027282, 0.025586643460728253, -0.06882535095124133,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr: t_imu = t_cam + 0.0074, so t_cam = t_imu - 0.0074
# Negated because our timestamps are IMU-based (trigger timestamps)
Camera.TimeOffset: -0.007434667357124599

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
# Increased for more robust tracking at 640x400 resolution
ORBextractor.nFeatures: 1500

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Lowered thresholds for better feature detection in low-texture areas
# Lower values = more features detected but more noise
ORBextractor.iniThFAST: 12
ORBextractor.minThFAST: 4

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
