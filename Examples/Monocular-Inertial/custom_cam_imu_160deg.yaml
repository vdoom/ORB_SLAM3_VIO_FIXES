%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# OV9281 global shutter monochrome camera, 640x400, 160° lens
#--------------------------------------------------------------------------------------------
Camera.type: "KannalaBrandt8"

# Camera intrinsics from Kalibr calibration (2026-02-02)
Camera.fx: 291.6860736681568
Camera.fy: 294.56816028811346
Camera.cx: 295.7509097524283
Camera.cy: 184.4328311195461

# Distortion parameters (equidistant/fisheye model: k1, k2, k3, k4)
Camera.k1: -0.1931512824547078
Camera.k2: 0.09555535206536514
Camera.k3: -0.14581172312881072
Camera.k4: 0.076729685407193

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. ICM-42688 IMU via SYSROX sensor PCB.
# Noise parameters adjusted 3x from datasheet values.
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, ICM-42688 adjusted 3x from datasheet)
IMU.NoiseGyro: 0.000135
IMU.NoiseAcc: 0.00207
IMU.GyroWalk: 3.0e-05
IMU.AccWalk: 0.0003

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_cam_imu from Kalibr calibration (2026-02-02)
# Transforms points from IMU frame to camera frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.9937483951246618, -0.09190984130156896, 0.06337750593926034, 0.021821477891131112,
          -0.06169608990611436, -0.021024351822996605, -0.9978735236094406, -0.002638991460309607,
          0.09304686817651212, -0.9955453569287261, 0.015222438050440832, -0.06517041526934045,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr timeshift_cam_imu: 0.007604010662153993
Camera.TimeOffset: -0.007604010662153993

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
# Increased from 800 to 1200 for more robust tracking
ORBextractor.nFeatures: 1200

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Lowered thresholds slightly for better feature detection in low-texture areas
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
