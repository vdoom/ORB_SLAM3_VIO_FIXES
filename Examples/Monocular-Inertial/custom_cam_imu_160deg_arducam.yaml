%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# Source: kalibr_data_2026-02-26_00-05-24-camchain-imucam.yaml
# Resolution: 640x400
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera intrinsics from Kalibr calibration (2026-02-26)
Camera.fx: 294.6559123077074
Camera.fy: 297.1622131665783
Camera.cx: 318.97472998678813
Camera.cy: 189.06441801166022

# Distortion parameters (equidistant model: k1, k2, p1, p2)
Camera.k1: -0.18614405887668517
Camera.k2: 0.024150706519554525
Camera.p1: -0.012738779998765042
Camera.p2: 0.006321282848172852

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. From Kalibr calibration.
# Source: kalibr_data_2026-02-26_00-05-24-imu.yaml
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-02-26)
IMU.NoiseGyro: 0.000135
IMU.NoiseAcc: 0.00207
IMU.GyroWalk: 3e-05
IMU.AccWalk: 0.0003

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_ic = inv(T_cam_imu) from Kalibr calibration (2026-02-26)
# Tbc = T_ic: transforms points from camera frame to IMU/body frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.031728456931345954, 0.999201497562702, -0.02428316884607603, 0.006545493522236276,
          0.9993084038941765, -0.031241766890353972, 0.02016595914009143, -0.0011830480118454707,
          0.01939120747211942, -0.02490620946712073, -0.9995017067532956, -0.04639827967493156,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr: t_imu = t_cam + 0.0075306, so t_cam = t_imu - 0.0075306
# Negated because our timestamps are IMU-based (trigger timestamps)
Camera.TimeOffset: -0.007530601388484953

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1500

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 8
ORBextractor.minThFAST: 3

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
