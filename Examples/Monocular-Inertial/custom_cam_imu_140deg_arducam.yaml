%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Calibrated using Kalibr with April grid.
# Source: kalibr_data_2026-02-23_13-33-44-camchain-imucam.yaml
# Resolution: 640x400
#--------------------------------------------------------------------------------------------
Camera.type: "PinHole"

# Camera intrinsics from Kalibr calibration (2026-02-23)
Camera.fx: 260.139841715643
Camera.fy: 258.53761874520217
Camera.cx: 368.6669162319716
Camera.cy: 204.12943424603068

# Distortion parameters (equidistant model: k1, k2, p1, p2)
Camera.k1: -0.014259029928017575
Camera.k2: 0.0005802760339864387
Camera.p1: -0.001677055802070656
Camera.p2: 1.1553028246762438e-05

# Camera resolution
Camera.width: 640
Camera.height: 400

# Camera frames per second
Camera.fps: 20.0

# Color order of the images (0: BGR, 1: RGB, 2: Grayscale)
Camera.RGB: 0

#--------------------------------------------------------------------------------------------
# IMU Parameters. From Kalibr calibration.
# Source: kalibr_data_2026-02-23_13-33-44-imu.yaml
#--------------------------------------------------------------------------------------------

# IMU noise parameters (continuous-time, from Kalibr 2026-02-23)
IMU.NoiseGyro: 0.000135
IMU.NoiseAcc: 0.00207
IMU.GyroWalk: 3e-05
IMU.AccWalk: 0.0003

# IMU sampling frequency
IMU.Frequency: 500

#--------------------------------------------------------------------------------------------
# Camera-IMU Extrinsic Calibration (Tbc: Body/IMU to Camera transformation)
#--------------------------------------------------------------------------------------------

# T_ic = inv(T_cam_imu) from Kalibr calibration (2026-02-23)
# Tbc = T_ic: transforms points from camera frame to IMU/body frame
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.031037666584753883, 0.999404560679237, -0.01507273520352444, 0.006824454121720734,
          0.9992746308329459, -0.03069366978867432, 0.022541313373097567, -0.000911044028682918,
          0.022065253831624474, -0.015761431675001283, -0.9996322833146701, -0.0393689754983857,
          0.0, 0.0, 0.0, 1.0]

# Time offset: Time_camera = Time_imu + td (in seconds)
# From Kalibr: t_imu = t_cam + 0.00692117, so t_cam = t_imu - 0.00692117
# Negated because our timestamps are IMU-based (trigger timestamps)
Camera.TimeOffset: -0.006921167910123351

# Insert KFs when there is no visual odometry
IMU.InsertKFsWhenLost: 0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1500

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
ORBextractor.iniThFAST: 8
ORBextractor.minThFAST: 3

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0

Viewer.imageViewScale: 1.0
